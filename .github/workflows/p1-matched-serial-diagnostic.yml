name: P1 matched serial control (non-admission)
on:
  pull_request:
    branches: [codex/p1-matched-serial-receipt-20261127]
permissions:
  contents: read
concurrency:
  group: p1-matched-serial-diagnostic-${{ github.event.pull_request.base.sha }}
  cancel-in-progress: false
jobs:
  parameter-state:
    if: ${{ github.event.pull_request.head.repo.full_name == github.repository && startsWith(github.head_ref, 'codex/p1-matched-serial-trigger-') }}
    name: Supported parameter-state only (non-admission)
    runs-on: ubuntu-22.04
    timeout-minutes: 120
    env:
      CC: clang-21
      CXX: clang++-21
      ESHKOL_CXX_COMPILER: clang++-21
      LLVM_CONFIG_EXECUTABLE: llvm-config-21
      ESHKOL_JOBS: '2'
      A0_COMPILER_TIMEOUT_SECONDS: '60'
      P1_COMPILER_TIMEOUT_SECONDS: '1200'
      T1_COMPILER_TIMEOUT_SECONDS: '600'
      T2_COMPILER_TIMEOUT_SECONDS: '600'
      D2_COMPILER_TIMEOUT_SECONDS: '900'
      K2_COMPILER_TIMEOUT_SECONDS: '900'
      O2_COMPILER_TIMEOUT_SECONDS: '1200'
      P1_LSAN: '1'
      C1_LSAN: '1'
      I2_ASAN_DETECT_LEAKS: '1'
      K2_ASAN_DETECT_LEAKS: '1'
      D2_ASAN_DETECT_LEAKS: '1'
      N2_ASAN_DETECT_LEAKS: '1'
      O2_ASAN_DETECT_LEAKS: '1'
      N3K_ASAN_DETECT_LEAKS: '1'
      L3S_ASAN_DETECT_LEAKS: '1'
      G3S_ASAN_DETECT_LEAKS: '1'
      M3T_ASAN_DETECT_LEAKS: '1'
      M3_ASAN_DETECT_LEAKS: '1'
      G3N_ASAN_DETECT_LEAKS: '1'
      G3C4_ASAN_DETECT_LEAKS: '1'
      P1_TWO_COMPILERS: '0'
      P1_PAIR_MEMORY_TRACE: '0'
      P1_KEEP_TMP: '1'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: 15f2522946b8ee13b9f166967a99f2665263d4d0
          fetch-depth: 0
      - name: Verify exact candidate source and record identity
        shell: /usr/bin/bash -euo pipefail {0}
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          root="$RUNNER_TEMP/p1-matched-serial-diagnostic"
          test ! -e "$root" && test ! -L "$root"
          mkdir -m 0700 "$root"
          test "$GITHUB_BASE_REF" = codex/p1-matched-serial-receipt-20261127
          [[ "$BASE_SHA" =~ ^[0-9a-f]{40}$ && "$PR_HEAD_SHA" =~ ^[0-9a-f]{40}$ ]]
          test "$(git rev-parse HEAD)" = 15f2522946b8ee13b9f166967a99f2665263d4d0
          test "$(git rev-parse 'HEAD^{tree}')" = 672e9da3d40061278e94ca0aa1954e98936afa7e
          test -z "$(git status --porcelain --untracked-files=all)"
          [[ "$P1_TWO_COMPILERS/$P1_PAIR_MEMORY_TRACE/$P1_KEEP_TMP" == 0/0/1 ]]
          test ! -e .deps && test ! -L .deps
          test ! -e build && test ! -L build
          printf 'mode\tP1_TWO_COMPILERS=0 P1_PAIR_MEMORY_TRACE=0 P1_KEEP_TMP=1\nstatus\tstarted\nworkflow_base\t%s\nsource_head\t%s\nsource_tree\t%s\ntrigger_head\t%s\nrun_id\t%s\nrun_attempt\t%s\n' \
            "$BASE_SHA" "$(git rev-parse HEAD)" "$(git rev-parse 'HEAD^{tree}')" \
            "$PR_HEAD_SHA" "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT" \
            > "$root/identity.tsv"
          sha256sum toolchain/eshkol.lock scripts/bootstrap-eshkol.sh scripts/common.sh \
            scripts/test-p1.sh scripts/p1-compile-pair.sh tests/p1/pair_memory_trace.py \
            > "$root/source-inputs.sha256"
          cat /etc/os-release > "$root/host-os.txt"
          grep '^MemAvailable:' /proc/meminfo > "$root/initial-memory.txt"
          echo 'P1 matched serial diagnostic only (non-admission).' >> "$GITHUB_STEP_SUMMARY"
      - name: Install host dependencies
        shell: /usr/bin/bash -euo pipefail {0}
        run: |
          wget -qO "$RUNNER_TEMP/llvm-snapshot.gpg.key" https://apt.llvm.org/llvm-snapshot.gpg.key
          gpg --show-keys --with-colons "$RUNNER_TEMP/llvm-snapshot.gpg.key" | grep -F 'fpr:::::::::6084F3CF814B57C1CF12EFD515CF4D18AF4F7421:'
          sudo install -m 0644 "$RUNNER_TEMP/llvm-snapshot.gpg.key" /etc/apt/trusted.gpg.d/apt.llvm.org.asc
          echo 'deb https://apt.llvm.org/jammy/ llvm-toolchain-jammy-21 main' | sudo tee /etc/apt/sources.list.d/llvm.list >/dev/null
          sudo apt-get update -o Acquire::Retries=5
          sudo apt-get install -y \
            build-essential clang-21 cmake git gnupg llvm-21 llvm-21-dev lld-21 make \
            ninja-build pkg-config wget libjpeg-dev libncurses-dev libopenblas-dev \
            libpcre2-dev libpng-dev libreadline-dev libsqlite3-dev libssl-dev libwebp-dev \
            ripgrep time
          test "$(llvm-config-21 --version)" = '21.1.8'
          clang-21 --version | head -1 >> "$RUNNER_TEMP/p1-matched-serial-diagnostic/toolchain.txt"
          llvm-config-21 --version >> "$RUNNER_TEMP/p1-matched-serial-diagnostic/toolchain.txt"
      - name: Restore pinned Eshkol toolchain
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: .deps
          key: eshkol-v1-${{ runner.os }}-${{ runner.arch }}-llvm-21.1.8-${{ hashFiles('toolchain/eshkol.lock', 'scripts/bootstrap-eshkol.sh', 'scripts/common.sh') }}
      - name: Verify pinned Eshkol toolchain
        id: toolchain
        shell: /usr/bin/bash -euo pipefail {0}
        run: |
          if compgen -G '.deps/eshkol-transformer-p1.*' >/dev/null; then
            echo "Unexpected retained P1 scratch in restored cache" >&2
            exit 1
          fi
          make toolchain > "$RUNNER_TEMP/p1-matched-serial-diagnostic/toolchain.log" 2>&1
          cp .deps/eshkol-build/eshkol-transformer-provenance.tsv \
            "$RUNNER_TEMP/p1-matched-serial-diagnostic/toolchain-provenance.tsv"
      - name: Build parameter-state prerequisites
        id: prerequisites
        shell: /usr/bin/bash -euo pipefail {0}
        run: /usr/bin/bash scripts/ci-build-prerequisites.sh parameter-state > "$RUNNER_TEMP/p1-matched-serial-diagnostic/prerequisites.log" 2>&1
      - name: Run complete parameter-state suite
        id: suite
        shell: /usr/bin/bash -euo pipefail {0}
        run: |
          trap 'cp "$GITHUB_STEP_SUMMARY" "$RUNNER_TEMP/p1-matched-serial-diagnostic/p1-step-summary.md" 2>/dev/null || true' EXIT
          make test-ci-parameters-after-build > "$RUNNER_TEMP/p1-matched-serial-diagnostic/parameter-state.log" 2>&1
      - name: Collect validated serial P1 evidence
        id: collect
        if: always()
        shell: /usr/bin/bash -euo pipefail {0}
        env:
          SUITE_OUTCOME: ${{ steps.suite.outcome }}
        run: |
          python3 - "$RUNNER_TEMP/p1-matched-serial-diagnostic" "$SUITE_OUTCOME" <<'PY'
          from pathlib import Path
          import re
          import sys

          def validate_timing(timing, source, workspace, outcome):
              if not timing.is_file() or timing.is_symlink():
                  raise ValueError("missing or linked compiler timing log")
              data = timing.read_bytes()
              content = data.decode("ascii")
              if not content.endswith("\n"):
                  raise ValueError("empty or truncated compiler timing log")
              negative_cases = {}
              for name in ("transformer-error-make", "transformer-error-raise",
                           "transformer-error-wrap-foreign", "e1-internal-dispatch",
                           "et-e1b-private-raise"):
                  negative_cases[f"cache-public-surface-{name}"] = (
                      False, f" -e (begin (require transformer.module) {name})")
              fixed_positive = set()
              for run in (1, 2):
                  public = ("example", "public-stubs", "public-reverse")
                  fixed_positive.update(f"cache-object-{name}-{run}.o" for name in ("module", *public))
                  fixed_positive.update(f"cache-aot-{name}-{run}" for name in public)
                  fixed_positive.add(f"cache-guessed-object-{run}")
                  for kind in ("provider", "module", "handle", "state_entry", "state_dict"):
                      stem = f"negative_public_{kind}_internal"
                      fixture = workspace / "tests/p1" / f"{stem}.esk"
                      for phase, suffix in (("source", f" -r {fixture}"),
                                            ("object", f" {fixture} -o {source}/{stem}.o"),
                                            ("aot", f" {fixture} -o {source}/{stem}")):
                          negative_cases[f"cache-{stem}-{phase}-{run}"] = (phase == "object", suffix)
                  fixture = workspace / "tests/p1/negative_guessed_private_native.esk"
                  negative_cases[f"cache-guessed-aot-{run}"] = (False, f" {fixture} -o {source}/guessed-private")
                  for stem in ("negative_wrong_arity", "negative_fixture_not_public",
                               "negative_provider_callback_arity"):
                      fixture = workspace / "tests/p1" / f"{stem}.esk"
                      negative_cases[f"cache-{stem}-{run}"] = (True, f" {fixture} -o {source}/{stem}.o")

              invocation = ("timeout --foreground --signal=TERM --kill-after=5s 1200s "
                            "env -u ESHKOL_PATH -u ESHKOL_JIT_CACHE_DIR "
                            "-u ESHKOL_AOT_MODULE_CACHE_DIR ESHKOL_JIT_CACHE=0 "
                            f"XDG_CACHE_HOME={source}/")
              runner = workspace / ".deps/eshkol-build/eshkol-run"
              record = re.compile(r"elapsed_s=[0-9]+\.[0-9]{2} max_rss_kib=[0-9]+ exit=([01]) command="
                                  + re.escape(invocation) + r"(cache-[A-Za-z0-9._-]+) "
                                  + re.escape(str(runner))
                                  + r"( --strict-types (?:--emit-object )?--no-stdlib [ -~]+)")
              generated_cache = re.compile(r"cache-compiler\.[A-Za-z0-9]{6}")
              lines = iter(content[:-1].split("\n"))
              seen = set()
              generated_count = 0
              for line in lines:
                  announced_failure = line == "Command exited with non-zero status 1"
                  match = record.fullmatch(next(lines, "") if announced_failure else line)
                  if match is None:
                      raise ValueError("malformed GNU time record")
                  status, cache, args = match.groups()
                  expected_negative = negative_cases.get(cache)
                  if ((status == "1") != announced_failure
                          or (status == "1") != (expected_negative is not None)):
                      raise ValueError("unexpected GNU time status")
                  if cache in seen:
                      raise ValueError("duplicate GNU time cache record")
                  seen.add(cache)
                  if expected_negative is not None:
                      expect_object, suffix = expected_negative
                      if (expect_object != args.startswith(" --strict-types --emit-object ")
                              or not args.endswith(suffix)):
                          raise ValueError("unexpected GNU time negative invocation")
                  elif generated_cache.fullmatch(cache):
                      generated_count += 1
                  elif cache not in fixed_positive:
                      raise ValueError("unexpected GNU time positive invocation")
              if outcome == "success" and (
                      generated_count != 8 or not (fixed_positive | negative_cases.keys()) <= seen):
                  raise ValueError("incomplete compiler timing inventory for successful suite")
              return data

          root, outcome = Path(sys.argv[1]), sys.argv[2]
          workspace = Path.cwd()
          log = root / "parameter-state.log"
          if not log.is_file():
              if outcome == "success":
                  raise SystemExit("successful suite has no log")
              raise SystemExit(0)
          log_text = log.read_text(errors="replace")
          markers = re.findall(r"^P1 preserved temporary evidence: (.+)$", log_text, re.MULTILINE)
          if len(markers) != 1:
              if outcome == "success":
                  raise SystemExit("successful suite needs exactly one P1 evidence path")
              raise SystemExit(0)
          source = Path(markers[0])
          if (not source.is_absolute() or not source.is_dir() or source.is_symlink()
                  or source.parent.resolve() != (workspace / ".deps").resolve()
                  or not re.fullmatch(r"eshkol-transformer-p1\.[A-Za-z0-9]+", source.name)):
              raise SystemExit("invalid P1 evidence path")
          if any(source.glob("pair-*-memory.*")):
              raise SystemExit("unexpected paired trace in the serial control")
          if outcome == "success" and len(re.findall(
                  r"^P1 PASS: E1B-integrated packaging, structural/native/registry checks, "
                  r"root-publication IR and poison proof, sanitizers, negatives, atomicity, and determinism$",
                  log_text, re.MULTILINE)) != 1:
              raise SystemExit("successful suite needs exactly one final P1 PASS")
          destination = root / "validated-p1"
          destination.mkdir(mode=0o700)

          def record_collection(timing_outcome):
              status = "complete" if outcome == "success" and timing_outcome == "validated" else "partial"
              (root / "collection.tsv").write_text(
                  f"scope\tserial P1 compiler timing only\n"
                  f"suite_outcome\t{outcome}\n"
                  f"validated_pairs\t0\n"
                  f"timing_outcome\t{timing_outcome}\nreceipt_status\t{status}\n")

          timing = source / "compiler-timing.log"
          try:
              timing_bytes = validate_timing(timing, source, workspace, outcome)
          except (OSError, ValueError) as error:
              record_collection("invalid")
              raise SystemExit(f"invalid compiler timing log: {error}")
          (destination / timing.name).write_bytes(timing_bytes)
          record_collection("validated")
          PY
      - name: Seal diagnostic receipt
        if: always()
        shell: /usr/bin/bash -euo pipefail {0}
        env:
          JOB_STATUS: ${{ job.status }}
          TOOLCHAIN_OUTCOME: ${{ steps.toolchain.outcome }}
          PREREQUISITES_OUTCOME: ${{ steps.prerequisites.outcome }}
          SUITE_OUTCOME: ${{ steps.suite.outcome }}
          COLLECT_OUTCOME: ${{ steps.collect.outcome }}
        run: |
          root="$RUNNER_TEMP/p1-matched-serial-diagnostic"
          test -d "$root" && test ! -L "$root"
          printf 'toolchain_outcome\t%s\nprerequisites_outcome\t%s\nsuite_outcome\t%s\ncollect_outcome\t%s\nfinal_job_status\t%s\n' \
            "$TOOLCHAIN_OUTCOME" "$PREREQUISITES_OUTCOME" "$SUITE_OUTCOME" "$COLLECT_OUTCOME" "$JOB_STATUS" \
            >> "$root/identity.tsv"
          (cd "$root" && find . -type f ! -name SHA256SUMS -print0 | \
            LC_ALL=C sort -z | xargs -0 -r sha256sum) > "$root/SHA256SUMS"
          (cd "$root" && sha256sum -c SHA256SUMS >/dev/null)
      - name: Upload diagnostic-only receipt
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: p1-matched-serial-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/p1-matched-serial-diagnostic/
          if-no-files-found: error
          retention-days: 30
