name: CI evidence selector diagnostic
on:
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  selector:
    runs-on: ubuntu-22.04
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Inspect hosted exact-tree selection without launching suites
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh --version
          python3 - <<'PY'
          from tests.ci.evidence import select_reuse
          result = select_reuse(
              "workflow_dispatch", "Gabriel-Kahen/eshkol-transformer",
              "aec841ba08c7e36cb4f3007708f22d347c935fb5",
              "2940b3052d7c6cf3ef7781fa30abcd9c733886c6")
          print(result)
          assert result.reused, result.reason
          PY
