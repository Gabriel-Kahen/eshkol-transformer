name: N2 oracle diagnostic

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  oracle-diagnostic:
    name: N2 oracle diagnostic / sample-${{ matrix.sample }}
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        sample: [1, 2, 3]
    env:
      ATEN_CPU_CAPABILITY: default
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: 3.14.6
          cache: pip
          cache-dependency-path: tests/n2/requirements-reference.lock
      - name: Install exact reference dependencies
        run: python -m pip install --requirement tests/n2/requirements-reference.lock
      - name: Regenerate and compare the N2 oracle
        run: python tests/ci/diagnose_n2_oracle.py --output-dir "$RUNNER_TEMP/n2-oracle-diagnostic"
      - name: Upload diagnostic evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: n2-oracle-diagnostic-${{ matrix.sample }}
          path: ${{ runner.temp }}/n2-oracle-diagnostic
          if-no-files-found: error
