# Hosted CI coverage for standalone Wave 4/5 Make targets.
#
# Preserves the frozen 23-suite Wave 0-3 evidence-reuse topology in ci.yml,
# full-coverage.yml, and acceptance.yml without modifying those workflows.
#
# Explicit Wave 4/5 Makefile exclusions (all other Wave 4/5 targets between
# test-io5 and test-c2 are covered in exactly one matrix shard below):
#   - test-io5-gguf-native: requires an external IO5_GGUF_NATIVE_PREFIX ggml
#     witness library built from llama.cpp; already enforced as a mandatory
#     gate in .github/workflows/full-coverage.yml (io5-gguf job).
#   - benchmark-wave45: standalone -O2 benchmark runner; already exercised
#     end-to-end (normal -O2 + ASan/UBSan/LSan smoke + schema checks) by
#     test-b0-wave45 in the benchmarks-docs shard.
#   - benchmark-wave5: standalone 11-engine benchmark runner; already exercised
#     end-to-end (two-run checksum invariance + group filter + ASan/UBSan/LSan
#     smoke + schema checks) by test-b0-wave5 in the benchmarks-docs shard.

name: Wave 4/5 Suites

on:
  pull_request:
    branches:
      - main
      - 'codex/wave4-5-*'
  push:
    branches:
      - main
      - 'codex/wave4-5-*'
  workflow_dispatch:
    inputs:
      shard:
        description: 'Wave 4/5 shard to run (default: all)'
        required: false
        default: all
        type: choice
        options:
          - all
          - core-wave4
          - wave4-backend-composed
          - mod5-variants
          - mod5-sequence-moe-mla
          - serving-kv-decode
          - quantization
          - optimizers-finetune-alignment
          - distributed
          - interop-eval-e2e
          - benchmarks-docs

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  static-guards:
    name: Static guards
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - name: Validate shard dispatch input
        env:
          EVENT_NAME: ${{ github.event_name }}
          REQUESTED_SHARD: ${{ inputs.shard || 'all' }}
        shell: /usr/bin/bash -euo pipefail {0}
        run: |
          if [[ "$EVENT_NAME" == workflow_dispatch ]]; then
            case "$REQUESTED_SHARD" in
              all|core-wave4|wave4-backend-composed|mod5-variants|mod5-sequence-moe-mla|serving-kv-decode|quantization|optimizers-finetune-alignment|distributed|interop-eval-e2e|benchmarks-docs) ;;
              *)
                echo "Invalid shard dispatch input: $REQUESTED_SHARD" >&2
                exit 1
                ;;
            esac
          fi

      - name: Run Python isolation and CI topology guards
        shell: /usr/bin/bash -euo pipefail {0}
        run: |
          make test-python-isolation
          make test-ci-topology
          python3 -m unittest -v tests.ci.test_wave45_workflow

  wave45-matrix:
    name: Wave 4/5 / ${{ matrix.shard }}
    needs: static-guards
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - shard: core-wave4
            targets: 'test-mp4 test-mp4-aot test-pa4-wider test-pa4-wider-aot test-ac4 test-ac4-aot'
          - shard: wave4-backend-composed
            targets: 'test-amd4 test-amd4-aot test-wave4-composed test-wave4-composed-aot test-data4-pipeline test-t2-trainer'
          - shard: mod5-variants
            targets: 'test-mod5 test-mod5-aot test-mod5-rope test-rope-yarn test-unigram-tok test-mtp-head'
          - shard: mod5-sequence-moe-mla
            targets: 'test-mod5-moe test-mod5-mla test-flash-attn2 test-ring-attn test-mamba-ssm'
          - shard: serving-kv-decode
            targets: 'test-mod5-generate test-spec-decode test-paged-kv test-radix-kv test-continuous-batch test-constrained-decode test-beam-search'
          - shard: quantization
            targets: 'test-io5-quant test-w4a32-quant test-fp8-gemm test-qlora-nf4 test-kv-cache-quant'
          - shard: optimizers-finetune-alignment
            targets: 'test-mod5-adamw test-o2-muon test-lora test-multi-lora-sgmv test-dpo test-grpo test-ppo-rlhf'
          - shard: distributed
            targets: 'test-dist5 test-dist5-aot test-pipeline-1f1b test-tensor-parallel test-fsdp-zero test-hybrid-mesh'
          - shard: interop-eval-e2e
            targets: 'test-io5 test-io5-gguf test-io5-live-c1 test-mod5-e2e test-eval5 test-eval5-aot test-e2e-lifecycle'
          - shard: benchmarks-docs
            targets: 'test-b0-wave45 test-b0-wave5 test-doc5 test-doc5-wave45'
    env:
      CC: clang-21
      CXX: clang++-21
      ESHKOL_CXX_COMPILER: clang++-21
      LLVM_CONFIG_EXECUTABLE: llvm-config-21
      ESHKOL_JOBS: '2'
    steps:
      - name: Reserve shard evidence
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.shard == 'all' || inputs.shard == matrix.shard }}
        env:
          SHARD_NAME: ${{ matrix.shard }}
        shell: /usr/bin/bash -euo pipefail {0}
        run: |
          root="$RUNNER_TEMP/wave45-evidence/${SHARD_NAME}"
          test ! -e "$root" && test ! -L "$root"
          mkdir -p "$RUNNER_TEMP/wave45-evidence"
          mkdir -m 0700 "$root"
          printf 'state\treserved\nshard\t%s\nrun_id\t%s\nrun_attempt\t%s\n' \
            "$SHARD_NAME" "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT" > "$root/workflow-status.tsv"

      - name: Checkout repository
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.shard == 'all' || inputs.shard == matrix.shard }}
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - name: Record commit and tree identity
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.shard == 'all' || inputs.shard == matrix.shard }}
        env:
          SHARD_NAME: ${{ matrix.shard }}
        shell: /usr/bin/bash -euo pipefail {0}
        run: |
          root="$RUNNER_TEMP/wave45-evidence/${SHARD_NAME}"
          head_sha="$(git rev-parse HEAD)"
          tree_sha="$(git rev-parse 'HEAD^{tree}')"
          printf 'ref\t%s\nhead\t%s\ntree\t%s\nshard\t%s\n' \
            "$GITHUB_REF" "$head_sha" "$tree_sha" "$SHARD_NAME" \
            > "$root/identity.tsv"

      - name: Install supported host dependencies
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.shard == 'all' || inputs.shard == matrix.shard }}
        env:
          SHARD_NAME: ${{ matrix.shard }}
        shell: /usr/bin/bash -euo pipefail {0}
        run: |
          root="$RUNNER_TEMP/wave45-evidence/${SHARD_NAME}"
          {
            wget -qO "$RUNNER_TEMP/llvm-snapshot.gpg.key" https://apt.llvm.org/llvm-snapshot.gpg.key
            gpg --show-keys --with-colons "$RUNNER_TEMP/llvm-snapshot.gpg.key" | grep -F 'fpr:::::::::6084F3CF814B57C1CF12EFD515CF4D18AF4F7421:'
            sudo install -m 0644 "$RUNNER_TEMP/llvm-snapshot.gpg.key" /etc/apt/trusted.gpg.d/apt.llvm.org.asc
            echo 'deb https://apt.llvm.org/jammy/ llvm-toolchain-jammy-21 main' | sudo tee /etc/apt/sources.list.d/llvm.list >/dev/null
            sudo apt-get update -o Acquire::Retries=5
            sudo apt-get install -y \
              build-essential clang-21 cmake git gnupg llvm-21 llvm-21-dev lld-21 make \
              ninja-build pkg-config wget libjpeg-dev libncurses-dev libopenblas-dev \
              libpcre2-dev libpng-dev libreadline-dev libsqlite3-dev libssl-dev libwebp-dev \
              ripgrep time
            test "$(llvm-config-21 --version)" = '21.1.8'
          } > "$root/dependencies.stdout" 2> "$root/dependencies.stderr"

      - name: Restore pinned Eshkol toolchain
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.shard == 'all' || inputs.shard == matrix.shard }}
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: .deps
          key: eshkol-v1-${{ runner.os }}-${{ runner.arch }}-llvm-21.1.8-${{ hashFiles('toolchain/eshkol.lock', 'scripts/bootstrap-eshkol.sh', 'scripts/common.sh') }}

      - name: Build pinned Eshkol toolchain
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.shard == 'all' || inputs.shard == matrix.shard }}
        env:
          SHARD_NAME: ${{ matrix.shard }}
        shell: /usr/bin/bash -euo pipefail {0}
        run: |
          root="$RUNNER_TEMP/wave45-evidence/${SHARD_NAME}"
          make toolchain > "$root/toolchain.stdout" 2> "$root/toolchain.stderr"

      - name: Run Wave 4/5 shard targets
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.shard == 'all' || inputs.shard == matrix.shard }}
        env:
          SHARD_NAME: ${{ matrix.shard }}
          SHARD_TARGETS: ${{ matrix.targets }}
        shell: /usr/bin/bash -euo pipefail {0}
        run: |
          root="$RUNNER_TEMP/wave45-evidence/${SHARD_NAME}"
          printf 'target\texit_code\tduration_seconds\n' > "$root/results.tsv"
          read -r -a targets <<< "$SHARD_TARGETS"
          test "${#targets[@]}" -gt 0
          failed=0
          for target in "${targets[@]}"; do
            started=$SECONDS
            log="$root/${target}.log"
            set +e
            make "$target" > "$log" 2>&1
            rc=$?
            set -e
            elapsed=$((SECONDS - started))
            printf '%s\t%s\t%s\n' "$target" "$rc" "$elapsed" >> "$root/results.tsv"
            if [[ "$rc" -ne 0 ]]; then
              printf 'FAIL: %s (exit %s, %ss)\n' "$target" "$rc" "$elapsed" >&2
              tail -n 120 "$log" >&2 || true
              failed=1
            else
              printf 'PASS: %s (%ss)\n' "$target" "$elapsed"
            fi
          done
          printf '### Shard `%s`\n\n| Target | Exit | Seconds |\n| --- | ---: | ---: |\n' "$SHARD_NAME" >> "$GITHUB_STEP_SUMMARY"
          awk -F'\t' 'NR > 1 { printf "| `%s` | %s | %s |\n", $1, $2, $3 }' "$root/results.tsv" >> "$GITHUB_STEP_SUMMARY"
          test "$failed" -eq 0

      - name: Seal shard evidence
        if: ${{ always() && (github.event_name != 'workflow_dispatch' || inputs.shard == 'all' || inputs.shard == matrix.shard) }}
        env:
          SHARD_NAME: ${{ matrix.shard }}
          PREVIOUS_JOB_STATUS: ${{ job.status }}
        shell: /usr/bin/bash -euo pipefail {0}
        run: |
          root="$RUNNER_TEMP/wave45-evidence/${SHARD_NAME}"
          test -d "$root" && test ! -L "$root"
          printf 'workflow_status_before_upload\t%s\n' "$PREVIOUS_JOB_STATUS" \
            >> "$root/workflow-status.tsv"
          (cd "$root" && find . -type f ! -path './SHA256SUMS' -print0 | \
            LC_ALL=C sort -z | xargs -0 -r sha256sum) > "$root/SHA256SUMS"
          (cd "$root" && sha256sum -c SHA256SUMS >/dev/null)

      - name: Upload shard evidence
        if: ${{ always() && (github.event_name != 'workflow_dispatch' || inputs.shard == 'all' || inputs.shard == matrix.shard) }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: wave45-evidence-${{ matrix.shard }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/wave45-evidence/${{ matrix.shard }}/
          if-no-files-found: error
          retention-days: 14

  wave45-gate:
    name: Wave 4/5 hosted gate
    needs: [static-guards, wave45-matrix]
    if: ${{ always() }}
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    steps:
      - name: Require static guards and matrix success
        env:
          STATIC_RESULT: ${{ needs.static-guards.result }}
          MATRIX_RESULT: ${{ needs.wave45-matrix.result }}
          EVENT_NAME: ${{ github.event_name }}
          REQUESTED_SHARD: ${{ inputs.shard || 'all' }}
        shell: /usr/bin/bash -euo pipefail {0}
        run: |
          test "$STATIC_RESULT" = success
          test "$MATRIX_RESULT" = success
          if [[ "$EVENT_NAME" == workflow_dispatch && "$REQUESTED_SHARD" != all ]]; then
            echo "Wave 4/5 single-shard dispatch passed: ${REQUESTED_SHARD} (partial run, not full Wave 4/5 admission)." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "Wave 4/5 full matrix gate passed: all 10 shards succeeded." >> "$GITHUB_STEP_SUMMARY"
          fi
