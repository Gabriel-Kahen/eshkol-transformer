name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  merge_group:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  topology:
    name: CI topology
    runs-on: ubuntu-22.04
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - run: make test-ci-topology

  blocking:
    name: Blocking CI / ${{ matrix.suite }}
    needs: topology
    runs-on: ubuntu-22.04
    timeout-minutes: 75
    strategy:
      fail-fast: false
      matrix:
        include:
          - suite: native-numerics
            build_target: build-ci-core
            test_target: test-ci-core-after-build
          - suite: contracts-data
            build_target: build-ci-contracts
            test_target: test-ci-contracts-after-build
          - suite: checkpoint-io
            build_target: build-ci-checkpoint
            test_target: test-ci-checkpoint-after-build
          - suite: parameter-state
            build_target: build-ci-parameters
            test_target: test-ci-parameters-after-build
          - suite: byte-tokenizer
            build_target: build-ci-tokenizer-byte
            test_target: test-ci-tokenizer-byte-after-build
          - suite: bpe-tokenizer
            build_target: build-ci-tokenizer-bpe
            test_target: test-ci-tokenizer-bpe-after-build
          - suite: shard-loader
            build_target: build-ci-dataset
            test_target: test-ci-dataset-after-build
    env:
      CC: clang-21
      CXX: clang++-21
      ESHKOL_CXX_COMPILER: clang++-21
      LLVM_CONFIG_EXECUTABLE: llvm-config-21
      ESHKOL_JOBS: '2'
      A0_COMPILER_TIMEOUT_SECONDS: '60'
      P1_LSAN: '1'
      C1_LSAN: '1'
      I2_ASAN_DETECT_LEAKS: '1'
      D2_ASAN_DETECT_LEAKS: '1'
      N2_ASAN_DETECT_LEAKS: '1'
      N3K_ASAN_DETECT_LEAKS: '1'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - name: Install host dependencies
        shell: /usr/bin/bash -euo pipefail {0}
        run: |
          wget -qO "$RUNNER_TEMP/llvm-snapshot.gpg.key" https://apt.llvm.org/llvm-snapshot.gpg.key
          gpg --show-keys --with-colons "$RUNNER_TEMP/llvm-snapshot.gpg.key" | grep -F 'fpr:::::::::6084F3CF814B57C1CF12EFD515CF4D18AF4F7421:'
          sudo install -m 0644 "$RUNNER_TEMP/llvm-snapshot.gpg.key" /etc/apt/trusted.gpg.d/apt.llvm.org.asc
          echo 'deb https://apt.llvm.org/jammy/ llvm-toolchain-jammy-21 main' | sudo tee /etc/apt/sources.list.d/llvm.list >/dev/null
          sudo apt-get update -o Acquire::Retries=5
          sudo apt-get install -y \
            build-essential clang-21 cmake git gnupg llvm-21 llvm-21-dev lld-21 make \
            ninja-build pkg-config wget libjpeg-dev libncurses-dev libopenblas-dev \
            libpcre2-dev libpng-dev libreadline-dev libsqlite3-dev libssl-dev libwebp-dev \
            ripgrep
          test "$(llvm-config-21 --version)" = '21.1.8'

      - name: Restore pinned Eshkol toolchain
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: .deps
          key: eshkol-v1-${{ runner.os }}-${{ runner.arch }}-llvm-21.1.8-${{ hashFiles('toolchain/eshkol.lock', 'scripts/bootstrap-eshkol.sh', 'scripts/common.sh') }}

      - name: Select pinned oracle Python
        if: matrix.suite == 'native-numerics'
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.14.6'

      - name: Install pinned development oracle
        if: matrix.suite == 'native-numerics'
        shell: /usr/bin/bash -euo pipefail {0}
        run: |
          python3 -m venv "$RUNNER_TEMP/development-oracle"
          "$RUNNER_TEMP/development-oracle/bin/python" -m pip install \
            --disable-pip-version-check \
            -r tests/n2/requirements-reference.lock
          {
            echo "N2_ORACLE_PYTHON=$RUNNER_TEMP/development-oracle/bin/python"
            echo "A2_ORACLE_PYTHON=$RUNNER_TEMP/development-oracle/bin/python"
            echo "Q0_PYTHON=$RUNNER_TEMP/development-oracle/bin/python"
            echo "ESHKOL_RUN=$GITHUB_WORKSPACE/.deps/eshkol-build/eshkol-run"
          } >> "$GITHUB_ENV"

      - name: Verify pinned Eshkol toolchain
        shell: /usr/bin/bash -euo pipefail {0}
        run: make toolchain

      - name: Build suite prerequisites
        shell: /usr/bin/bash -euo pipefail {0}
        run: make clean && make "${{ matrix.build_target }}"

      - name: Run full suite
        shell: /usr/bin/bash -euo pipefail {0}
        run: make "${{ matrix.test_target }}"

      - name: Smoke and benchmark
        if: matrix.suite == 'native-numerics'
        shell: /usr/bin/bash -euo pipefail {0}
        run: make smoke-after-build benchmark-after-build

  f0-linux:
    name: Ubuntu 22.04 x86-64 / Clang-LLVM 21.1.8
    if: ${{ always() }}
    needs: [topology, blocking]
    runs-on: ubuntu-22.04
    timeout-minutes: 2
    steps:
      - name: Require topology and every blocking suite
        env:
          TOPOLOGY_RESULT: ${{ needs.topology.result }}
          BLOCKING_RESULT: ${{ needs.blocking.result }}
        run: test "${TOPOLOGY_RESULT}" = success && test "${BLOCKING_RESULT}" = success
